# Render.com 블루프린트: 저장소를 연결하면 이 설정으로 배포돼요. (영구 디스크는 유료 플랜에서 제공되니 요금제를 확인하세요)
services:
  - type: web
    name: jinro-ai
    runtime: docker
    plan: starter # 영구 디스크를 쓰려면 유료 플랜이 필요해요 (요금은 Render 사이트에서 확인)
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - { key: DATA_DIR, value: /data }
      - { key: TRUST_PROXY, value: "1" }
      - { key: BETA, value: "1" } # 베타 안내 배너 + 검색엔진 색인 차단. 정식 오픈 때 지우세요
      - { key: ADMIN_EMAIL, sync: false }
      - { key: ADMIN_PASSWORD, sync: false }
      - { key: ANTHROPIC_API_KEY, sync: false }
